services:
  postgres:
    image: postgres:16-alpine
    container_name: agent_skills_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agent_skills_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_to_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-agent_skills}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent_skills_user} -d ${POSTGRES_DB:-agent_skills}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    container_name: agent_skills_backend
    restart: unless-stopped
    working_dir: /app
    environment:
      SECRET_KEY: ${SECRET_KEY:-}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-agent_skills_user}:${POSTGRES_PASSWORD:-change_this_to_secure_password}@postgres:5432/${POSTGRES_DB:-agent_skills}}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-agent_skills_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_to_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-agent_skills}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003}
      WATCHFILES_FORCE_POLLING: ${WATCHFILES_FORCE_POLLING:-true}
    expose:
      - "8000"
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health')\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    command:
      - sh
      - -c
      - |
        uv sync --frozen
        uv run python wait_for_db.py
        uv run alembic upgrade head
        exec uv run uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    image: node:20-bookworm-slim
    container_name: agent_skills_frontend
    restart: unless-stopped
    working_dir: /app
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://backend:8000/api}
      WATCHPACK_POLLING: ${WATCHPACK_POLLING:-true}
      NODE_ENV: development
    expose:
      - "3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    command:
      - sh
      - -c
      - |
        npm ci
        exec npm run dev -- --hostname 0.0.0.0 --port 3000

  gateway:
    image: nginx:1.27-alpine
    container_name: agent_skills_gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  backend_venv:
  frontend_node_modules:
